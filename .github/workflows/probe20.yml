name: probe20
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: manhwa source hunt
        run: |
          mkdir -p out
          python3 - << 'PY'
          import urllib.request, ssl, json, re, time
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36"}
          def get(url, timeout=25):
              req = urllib.request.Request(url, headers=UA)
              r = urllib.request.urlopen(req, timeout=timeout)
              return r.status, r.read()
          CANDS = {
            "mangapark":  "https://mangapark.net/search?word=solo+leveling",
            "bato":       "https://bato.to/search?word=solo+leveling",
            "mangabuddy": "https://mangabuddy.com/search?q=solo+leveling",
            "mangakatana":"https://mangakatana.com/search?q=solo+leveling",
            "mangakakalotv":"https://mangakakalot.tv/search?q=solo+leveling",
            "mangareader":"https://mangareader.to/search?keyword=solo+leveling",
            "mangadna":   "https://mangadna.com/search?q=solo+leveling",
            "manhwatop":  "https://manhwatop.com/?s=solo+leveling&post_type=wp-manga",
          }
          for name, url in CANDS.items():
              try:
                  st, b = get(url)
                  cf = b"just a moment" in b.lower() or b"cf-chl" in b.lower() or b"cloudflare" in b.lower()
                  real = st == 200 and not cf and len(b) > 20000
                  open("out/%s_search.html" % name, "wb").write(b)
                  print(name, st, len(b), "CF" if cf else ("REAL" if real else "SMALL"))
              except Exception as e:
                  print(name, "ERR", str(e)[:90])
          # comick JSON API
          for name, url in [
            ("comick_search", "https://api.comick.fun/v1.0/search?q=solo+leveling&limit=5&tachiyomi=true"),
            ("comick_top", "https://api.comick.fun/top?comic_types=manhwa&tachiyomi=true"),
          ]:
              try:
                  st, b = get(url)
                  j = json.loads(b)
                  n = len(j) if isinstance(j, list) else "?"
                  open("out/%s.json" % name, "wb").write(b)
                  print(name, st, len(b), "items:", n, "sample:", (json.dumps(j[0])[:120] if isinstance(j, list) and j else "?"))
              except Exception as e:
                  print(name, "ERR", str(e)[:90])
          PY
      - uses: actions/upload-artifact@v4
        with: {name: probe20, path: out/}
