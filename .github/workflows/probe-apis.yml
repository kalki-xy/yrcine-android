name: Probe APIs

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoints
        run: |
          set +e
          UA='Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36'
          echo "### nhentai-detail-pages"
          curl -s --max-time 25 -A "$UA" -H 'Accept: application/json' 'https://nhentai.net/api/v2/galleries/684611' | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print('keys:', sorted(d.keys()))
          print('images:', json.dumps(d.get('images',{}))[:600])
          print('num_pages:', d.get('num_pages'))
          "
          for u in 'https://i.nhentai.net/galleries/4214294/1.webp' 'https://i2.nhentai.net/galleries/4214294/1.webp' 'https://i5.nhentai.net/galleries/4214294/1.webp' 'https://i7.nhentai.net/galleries/4214294/1.webp' 'https://t.nhentai.net/galleries/4214294/thumb.webp' 'https://static1.e621.net/data/preview/5e/19/5e1910a5f9f78af3be2839da53adffeb.jpg'; do
            code=$(curl -s -o /dev/null --max-time 15 -w '%{http_code}' -A "$UA" "$u")
            echo "### img $u => $code"
          done
          echo "### e621-page2"
          curl -s --max-time 25 -A "$UA" -H 'Accept: application/json' 'https://e621.net/posts.json?tags=rating:e+blonde&limit=1&page=2' | head -c 200
