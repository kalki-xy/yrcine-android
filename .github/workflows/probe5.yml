name: probe5
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: Test keys + harvest seed
        run: |
          KEYS="20be784f740b6b638c906dde5b35efae c9873e67c5e03bd61e79d852c2fd46a6 992758a4802a699e8df27d4d6efc34fb"
          GOOD=""
          > keyresult.txt
          for K in $KEYS; do
            R=$(curl -s --max-time 25 "https://api.themoviedb.org/3/trending/all/day?api_key=$K" | head -c 60)
            echo "$K => $R" >> keyresult.txt
            if echo "$R" | grep -q '"results"'; then GOOD=$K; fi
          done
          echo "WORKING=$GOOD" >> keyresult.txt
          if [ -n "$GOOD" ]; then
            for EP in "trending" "popular_mov" "popular_tv" "top_rated"; do
              case $EP in
                trending) URL="https://api.themoviedb.org/3/trending/all/day?api_key=$GOOD";;
                popular_mov) URL="https://api.themoviedb.org/3/movie/popular?api_key=$GOOD&page=1";;
                popular_tv) URL="https://api.themoviedb.org/3/tv/popular?api_key=$GOOD&page=1";;
                top_rated) URL="https://api.themoviedb.org/3/movie/top_rated?api_key=$GOOD&page=1";;
              esac
              for i in 1 2 3; do curl -s --max-time 25 "$URL" -o "$EP.json" && [ -s "$EP.json" ] && grep -q results "$EP.json" && break; sleep 3; done
            done
            python3 - << 'PY'
            import json, glob
            keep = ["id","title","name","media_type","release_date","first_air_date","backdrop_path","poster_path","vote_average"]
            out = {}
            for f in glob.glob("*.json"):
                if f == "keyresult.txt": continue
                try:
                    d = json.load(open(f))
                    rs = [{k: r[k] for k in keep if k in r} for r in (d.get("results") or [])[:20]]
                    out[f.replace(".json","")] = rs
                except Exception as e: print("bad", f, e)
            json.dump(out, open("seed.json","w"), separators=(",",":"))
            print("seed size", len(json.dumps(out)))
            PY
          fi
      - uses: actions/upload-artifact@v4
        with: {name: probe5, path: "keyresult.txt"}
      - uses: actions/upload-artifact@v4
        if: hashFiles('seed.json') != ''
        with: {name: seed5, path: seed.json}
