<!DOCTYPE html>
<html lang="en" data-theme="obsidian">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="description" content="YRcine — Next-Gen Blockbuster Movies, TV Series, Simulcast Anime, Manga, Hi-Fi Music & AI Studio.">
<title>YRcine | Cinematic Streaming, Anime, Manga & AI Studio</title>
<script id="yrcine-inline-config">
/* Defaults inlined so this single file deploys on its own. If a
   site-config.js sits next to it, that file overrides these. */
window.YRCINE_CONFIG = {
  /* --- TMDB -------------------------------------------------------------
   * Kept in the page so movie/TV still works if the relay is unreachable. */
  tmdbApiKey: "20be784f740b6b638c906dde5b35efae",
  tmdbConfigured: true,

  /* --- relay ------------------------------------------------------------
   * Your custom Cloudflare Worker backend. If a valid edgeBase is set, the app
   * routes all relay traffic through it instead of the default Vercel host.
   * Leave this blank only if you intentionally want the Vercel fallback.
   */
  relayBase: "https://yrcine-edge.<your-subdomain>.workers.dev",
  proxyBase: "https://yrcine-edge.<your-subdomain>.workers.dev/api/proxy?url=",
  embedBase: "https://yrcine-edge.<your-subdomain>.workers.dev/api/embed?url=",
  adBlockBase: "https://yrcine-edge.<your-subdomain>.workers.dev/api/embed?url=",
  catalogBase: "https://yrcine-edge.<your-subdomain>.workers.dev/api/catalog",
  tmdbBase: "https://yrcine-edge.<your-subdomain>.workers.dev/api/tmdb",
  proxyEnabled: true,

  /* Image proxy for blocked image hosts (posters, MangaDex covers). */
  imageProxy: "https://yrcine-edge.<your-subdomain>.workers.dev/api/image?url=",

  /* Public CORS proxies — used only when the relay is not available. */
  publicProxies: [
    "https://corsproxy.io/?url=",
    "https://api.allorigins.win/raw?url=",
    "https://api.codetabs.com/v1/proxy?quest="
  ],

  /* How long a direct request may take before we fall back (ms). Slow
   * cellular cold-start needs more than 3s. */
  directTimeoutMs: 5000,

  /* Any hostname here is fetched through the relay/fallback instead of
   * straight from the visitor's browser. NOTE: the image proxy (wsrv.nl) and
   * the AI host (pollinations.ai) are deliberately absent — routing those
   * through a CORS proxy is circular and breaks POST bodies. */
  proxyHosts: [
    "api.themoviedb.org", "image.tmdb.org", "themoviedb.org",
    "graphql.anilist.co", "anilist.co",
    "mangapill.com", "mangadex.org", "uploads.mangadex.org", "mangabuddy.com",
    "anilink.cc", "voidverse.me",
    "vidzee.wtf", "vidfast.pro", "vidspark.to", "primesrc.me", "peachify.top",
    "vidnest.fun", "vidcore.org", "2embed.skin", "2embed.to", "vidsrc.pm",
    "vaplayer.ru", "vidup.to", "123embed.net", "mapple.fun", "anyembed.xyz",
    "vidsrc.su", "vidsrc.to", "multiembed.mov", "111movies.com", "vidlink.pro",
    "videasy.net", "vidora.su", "vidsrc.cc", "frembed.cc", "vidsrc.net",
    "embed.su", "autoembed.cc", "smashystream.com",
    "eporner.com", "adultgames.games", "xxxgames.games",
    "discord.com", "discordapp.com", "discordapp.net"
  ],

  /* --- optional profile sync backend ------------------------------------ */
  syncApiUrl: "https://yrcine-edge.<your-subdomain>.workers.dev/api/sync",

  /* --- Cloudflare edge: fast loading + unblock + ad-block ---------------
   * Replace <your-subdomain> with your actual Cloudflare Worker subdomain.
   * This is the worker URL that should host the YRcine backend. */
  edgeBase: "https://yrcine-edge.<your-subdomain>.workers.dev"
};

/* If edgeBase is set, derive every relay route from it BEFORE the net shim runs. */
(function (c) {
  try {
    var e = String(c.edgeBase || "").replace(/\/+$/, "");
    if (!e) return;
    c.relayBase   = e;
    c.proxyBase   = e + "/api/proxy?url=";
    c.embedBase   = e + "/api/embed?url=";
    c.catalogBase = e + "/api/catalog";
    c.tmdbBase    = e + "/api/tmdb";
    c.adBlockBase = e + "/api/embed?url=";
    c.imageProxy  = e + "/api/image?url=";
  } catch (err) {}
})(window.YRCINE_CONFIG);
</script>
<script src="./site-config.js"></script>
<script id="yrcine-no-vpn-net-shim">
(function () {
  "use strict";
  if (window.__YR_NET_SHIM) return;
  window.__YR_NET_SHIM = 1;

  var CFG = (window.YRCINE_CONFIG = window.YRCINE_CONFIG || {});
  if (CFG.tmdbConfigured === undefined) CFG.tmdbConfigured = true;
  if (CFG.proxyEnabled === false) return;

  var PROXY = CFG.proxyBase || "/api/proxy?url=";
  var EMBED = CFG.adBlockBase || CFG.embedBase || "/api/embed?url=";
  var IMG_PROXY = CFG.imageProxy || "https://wsrv.nl/?url=";
  var DIRECT_MS = CFG.directTimeoutMs || 5000;

  function hostOf(u) {
    try { return new URL(u, location.href).hostname.replace(/^www\./, "").toLowerCase(); }
    catch (e) { return ""; }
  }
  var RELAY_HOST = "";
  if (CFG.relayBase) RELAY_HOST = hostOf(CFG.relayBase);
  if (!RELAY_HOST && /^https?:\/\//i.test(PROXY)) RELAY_HOST = hostOf(PROXY);

  var HOSTS = CFG.proxyHosts || [
    "api.themoviedb.org", "image.tmdb.org", "themoviedb.org",
    "graphql.anilist.co", "anilist.co",
    "mangapill.com", "mangadex.org", "uploads.mangadex.org", "mangabuddy.com",
    "anilink.cc", "voidverse.me",
    "vidzee.wtf", "vidfast.pro", "vidspark.to", "primesrc.me", "peachify.top",
    "vidnest.fun", "vidcore.org", "2embed.skin", "2embed.to", "vidsrc.pm",
    "vaplayer.ru", "vidup.to", "123embed.net", "mapple.fun", "anyembed.xyz",
    "vidsrc.su", "vidsrc.to", "multiembed.mov", "111movies.com", "vidlink.pro",
    "videasy.net", "vidora.su", "vidsrc.cc", "frembed.cc", "vidsrc.net",
    "embed.su", "autoembed.cc", "smashystream.com",
    "eporner.com", "adultgames.games", "xxxgames.games",
    "discord.com", "discordapp.com", "discordapp.net"
  ];

  var PUBLIC = CFG.publicProxies || [
    "https://corsproxy.io/?url=",
    "https://api.allorigins.win/raw?url=",
    "https://api.codetabs.com/v1/proxy?quest="
  ];

  var PROXY_READY = null;

  function matches(host) {
    if (!host) return false;
    for (var i = 0; i < HOSTS.length; i++) {
      var p = String(HOSTS[i]).toLowerCase();
      if (host === p || host.slice(-(p.length + 1)) === "." + p) return true;
    }
    return false;
  }
  function blocked(u) {
    if (typeof u !== "string" || !/^https?:\/\//i.test(u)) return false;
    var h = hostOf(u);
    if (!h || h === location.hostname || h === RELAY_HOST) return false;
    return matches(h);
  }
  function already(u) { return u.indexOf(PROXY) === 0 || u.indexOf(EMBED) === 0 || u.indexOf(IMG_PROXY) === 0; }
  function wrap(u, base) {
    if (!PROXY_READY) return u;
    if (typeof u !== "string" || !/^https?:\/\//i.test(u) || already(u) || !blocked(u)) return u;
    return base + encodeURIComponent(u);
  }
  function imgWrap(u) {
    if (typeof u !== "string" || !/^https?:\/\//i.test(u) || already(u) || !blocked(u)) return u;
    return IMG_PROXY + encodeURIComponent(u);
  }
  window.__yrProxyWrap = wrap;

  function isLocalCatalog(u) {
    try {
      var x = new URL(u, location.href);
      return x.origin === location.origin && x.pathname.indexOf("/api/catalog") === 0;
    } catch (e) { return false; }
  }

  var _fetch = window.fetch;

  function withTimeout(p, ms) {
    return Promise.race([p, new Promise(function (_, rej) {
      setTimeout(function () { rej(new Error("timeout")); }, ms);
    })]);
  }
  function proxyThrough(url, init) {
    var o = init ? Object.assign({}, init) : {};
    delete o.signal;
    var ps = PUBLIC.map(function (pfx) {
      return _fetch.call(window, pfx + encodeURIComponent(url), o).then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r;
      });
    });
    return Promise.any(ps)
      .catch(function () { return _fetch.call(window, url, o); });
  }

  function maybeWrap(url, kind) {
    if (typeof url !== "string") return url;
    if (!/^https?:\/\//i.test(url)) return url;
    if (already(url) || !blocked(url)) return url;
    if (kind === "img") return imgWrap(url);
    return wrap(url, PROXY);
  }

  function interceptFetch() {
    window.fetch = function (input, init) {
      var u = typeof input === "string" ? input : (input && input.url ? input.url : "");
      if (typeof u === "string" && blocked(u) && !already(u) && !isLocalCatalog(u)) {
        var out = PROXY + encodeURIComponent(u);
        return _fetch.call(window, out, init);
      }
      return _fetch.call(window, input, init);
    };
  }

  function detectRelay() {
    if (!CFG.relayBase) {
      PROXY_READY = false;
      return;
    }
    withTimeout(_fetch.call(window, CFG.relayBase + "/health"), 2500)
      .then(function (r) { PROXY_READY = r.ok; })
      .catch(function () { PROXY_READY = false; })
      .finally(function () {
        interceptFetch();
      });
  }

  detectRelay();
})();
</script>
</head>

  <div id="app"></div>
</body>
